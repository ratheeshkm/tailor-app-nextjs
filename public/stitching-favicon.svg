<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <!-- Scissors: open blades (thick strokes from pivot to finger loops) -->
  <line x1="256" y1="260" x2="168" y2="120" stroke="url(#metal)" stroke-width="28" stroke-linecap="round"/>
  <line x1="256" y1="260" x2="344" y2="120" stroke="url(#metal)" stroke-width="28" stroke-linecap="round"/>
  <!-- Left finger loop -->
  <circle cx="168" cy="120" r="36" fill="url(#bg)" stroke="url(#metal)" stroke-width="14"/>
  <!-- Right finger loop -->
  <circle cx="344" cy="120" r="36" fill="url(#bg)" stroke="url(#metal)" stroke-width="14"/>
  <!-- Pivot screw -->
  <circle cx="256" cy="260" r="30" fill="#1e293b" stroke="#f8fafc" stroke-width="5"/>
</svg>
